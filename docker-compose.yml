services:
  postgres:
    image: postgres:16-alpine
    container_name: sskatt-db
    environment:
      POSTGRES_DB: sskatt_db
      POSTGRES_USER: sskatt_admin
      POSTGRES_PASSWORD: production_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: sskatt-backend
    environment:
      PORT: 5000
      DATABASE_URL: postgres://sskatt_admin:production_password@postgres:5432/sskatt_db
      JWT_SECRET: super_secure_production_secret
      SUPERADMIN_PASS: superadmin123
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: sskatt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: